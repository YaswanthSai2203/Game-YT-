<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="description" content="NEON ARCADE — Play NEON PULSE and more cyberpunk mini-games in your browser." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NEON ARCADE</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      #game-container { width: 100%; height: 100%; position: relative; overflow: hidden; touch-action: manipulation; }
      body.gameplay-active #game-container { touch-action: none; }
      /* Pixi NEON PULSE canvas only — mini-games need pointer input on nested canvases */
      #game-container > canvas {
        display: block; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0;
        pointer-events: none;
      }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <div id="game-container" role="application" aria-label="NEON ARCADE">
      <span class="sr-only" id="live-region" aria-live="polite"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
